[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latexmath"
version = "0.1.0"
description = "Shared PARG raw syntax runtime for latexmath"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["parsanol==0.1.23"]
license = {text = "BSD-2-Clause"}

[tool.setuptools]
license-files = ["LICENSE", "licenses/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latexmath = ["artifacts/*.json"]
